        .glass-panel {
            background: rgba(15, 23, 42, 0.78);
            backdrop-filter: blur(12px);

            border: 1px solid rgba(255, 255, 255, 0.15);

            background: rgba(30, 41, 59, 0.7);

            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);

        .glass-card:hover {
            border-color: rgba(56, 189, 248, 0.6);
            transform: translateY(-3px) scale(1.01);
            box-shadow: 0 10px 25px -5px rgba(56, 189, 248, 0.25);

        .glass-card.selected {
            border-color: #facc15;
            background: rgba(30, 58, 138, 0.85);
            box-shadow: 0 0 20px rgba(250, 204, 21, 0.35);
        }

        /* Canvas Wrapper */
        #game-container {
            position: relative;
            width: 100vw;
            height: 100dvh;
            max-width: 920px;
            max-height: 560px;
            border-radius: 20px;
            overflow: hidden;
            border: 3px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            background: #090d16;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: contain;
            object-position: center;
        }

        /* Route Progress Gauge */
        .progress-bar-inner {
            transition: width 0.3s ease-out;
        }

        /* Toast Animation */
        @keyframes slideDownCenter {
            0% { transform: translate(-50%, -30px) scale(0.85); opacity: 0; }
            100% { transform: translate(-50%, 0) scale(1); opacity: 1; }
        }

        .toast-pop {
            animation: slideDownCenter 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        /* Pulse glow animation */
        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 15px rgba(250, 204, 21, 0.4); }
            50% { box-shadow: 0 0 28px rgba(250, 204, 21, 0.8); }
        }

        .pulse-btn {
            animation: pulseGlow 2s infinite;

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);

        ::-webkit-scrollbar-thumb {

            position: absolute;
            bottom: 16px;
            left: 16px;
            right: 16px;
            justify-content: space-between;
            z-index: 30;

            color: white;

            #mobile-controls {

            }
            #game-container {
                max-width: 100vw;
                max-height: 100dvh;
                border-radius: 0;
                border: none;

    <script>
        // Web Audio API Retro Sound Effects
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;
        let soundMuted = false;

        function playSound(type) {
            if (soundMuted) return;
            try {
                if (!audioCtx) audioCtx = new AudioCtx();
                if (audioCtx.state === 'suspended') audioCtx.resume();

                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                const now = audioCtx.currentTime;

                if (type === 'jump') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(150, now);
                    osc.frequency.exponentialRampToValueAtTime(480, now + 0.12);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.linearRampToValueAtTime(0, now + 0.12);
                    osc.start(now);
                    osc.stop(now + 0.12);
                } else if (type === 'collect') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523.25, now);
                    osc.frequency.setValueAtTime(659.25, now + 0.08);
                    osc.frequency.setValueAtTime(783.99, now + 0.16);
                    osc.frequency.setValueAtTime(1046.50, now + 0.24);
                    gain.gain.setValueAtTime(0.18, now);
                    gain.gain.linearRampToValueAtTime(0, now + 0.35);
                    osc.start(now);
                    osc.stop(now + 0.35);
                } else if (type === 'clear') {
                    osc.type = 'triangle';
                    const freqs = [523.25, 659.25, 783.99, 987.77, 1046.50];
                    freqs.forEach((f, idx) => {
                        osc.frequency.setValueAtTime(f, now + idx * 0.1);
                    });
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.linearRampToValueAtTime(0, now + 0.65);
                    osc.start(now);
                    osc.stop(now + 0.65);
                }
            } catch (e) {}
        }

        function showSpotToast(spot) {
            const toast = document.getElementById('spot-toast');

            toast.classList.remove('hidden');

            if (toastTimeout) clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.add('hidden');

        function handleJump() {
            if (gameState !== 'PLAYING') return;
            if (player.grounded) {
                player.vy = player.jumpStrength;
                player.grounded = false;
                player.doubleJumped = false;
                player.squash = 1.3;
                createDustParticles(player.x + player.width / 2, player.y + player.height);
                playSound('jump');
            } else if (!player.doubleJumped) {
                player.vy = player.jumpStrength * 0.85;
                player.doubleJumped = true;
                player.squash = 1.3;
                createBurstParticles(player.x + 18, player.y + 40, '#ffffff');
                playSound('jump');
            }
        }

        function initControls() {
            renderRouteCards('ALL');

            window.addEventListener('keydown', (e) => {
                if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
                if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
                if ((e.code === 'ArrowUp' || e.code === 'Space' || e.code === 'KeyW')) {
                    handleJump();
                }
            });

            window.addEventListener('keyup', (e) => {
                if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
                if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
            });

            const bindTouch = (id, keyName) => {
                const el = document.getElementById(id);
                el.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    if (keyName === 'jump') {
                        handleJump();
                    } else {
                        keys[keyName] = true;
                    }
                });
                el.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    if (keyName !== 'jump') keys[keyName] = false;
                });
            };

            bindTouch('btn-left', 'left');
            bindTouch('btn-right', 'right');
            bindTouch('btn-jump', 'jump');

            document.getElementById('start-btn').onclick = () => {
                activeRoute = busRoutesData[selectedRouteIdx];
                document.getElementById('hud-bus-type').innerText = activeRoute.type;
                document.getElementById('hud-bus-type').className = `${activeRoute.typeBg} px-2.5 py-1 rounded-full text-xs font-black text-white shadow-md`;
                document.getElementById('hud-route-name').innerText = activeRoute.num;
                document.getElementById('start-screen').classList.add('hidden');
                resetGame();
                gameState = 'PLAYING';
                playSound('collect');
            };

            document.getElementById('restart-btn').onclick = () => {
                document.getElementById('end-screen').classList.add('hidden');
                document.getElementById('start-screen').classList.remove('hidden');
                gameState = 'START';
            };
        }

        function resetGame() {
            player.x = 80;
            player.y = 300;
            player.vx = 0;
            player.vy = 0;
            score = 0;
            collectedCount = 0;
            collectedList = [];
            cameraX = 0;
            particles = [];

            activeItems = activeRoute.touristSpots.map(spot => ({
                name: spot.name,
                x: spot.x,
                y: spot.y,
                w: 36,
                h: 36,
                desc: spot.desc,
                distance: spot.distance,
                collected: false
            }));

            updateHUD();
        }

        function updateHUD() {
            document.getElementById('score-val').innerText = score;
            document.getElementById('spot-count-val').innerText = `${collectedCount} / ${activeItems.length}`;

            const progress = Math.min(100, Math.max(0, Math.floor((player.x / goal.x) * 100)));
            document.getElementById('progress-percent-text').innerText = `${progress}%`;
            document.getElementById('progress-bar').style.width = `${progress}%`;
        }

        function createBurstParticles(x, y, color) {
            for (let i = 0; i < 18; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 5 + 2;
                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    size: Math.random() * 5 + 3,
                    color: color,
                    alpha: 1.0,
                    life: 0.03 + Math.random() * 0.02
                });
            }
        }

        function createDustParticles(x, y) {
            for (let i = 0; i < 6; i++) {
                particles.push({
                    x: x + (Math.random() - 0.5) * 16,
                    y: y,
                    vx: (Math.random() - 0.5) * 2,
                    vy: -Math.random() * 1.5,
                    size: Math.random() * 4 + 2,
                    color: '#e2e8f0',
                    alpha: 0.6,
                    life: 0.05
                });
            }
        }

        function updateParticles() {
            particles.forEach((p, idx) => {
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= p.life;
                if (p.alpha <= 0) particles.splice(idx, 1);
            });
        }

        function drawParticles() {
            particles.forEach(p => {
                ctx.save();
                ctx.globalAlpha = Math.max(0, p.alpha);
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });
        }

        // Preload Omena Images
        const imgOmenaRun = new Image(); imgOmenaRun.src = '/characters/5. 응용형(자전거).png';
        const imgOmenaJump = new Image(); imgOmenaJump.src = '/characters/15. 응용형(최고).png';
        const imgOmenaIdle = new Image(); imgOmenaIdle.src = '/characters/31. 응용형(길찾기).png';

        function drawOmena(x, y, facingLeft, squash) {
            ctx.save();
            ctx.translate(x + player.width / 2, y + player.height / 2);
            if (facingLeft) ctx.scale(-1, 1);
            ctx.scale(1 / squash, squash);

            let currentImg = imgOmenaIdle;
            if (!player.grounded) {
                currentImg = imgOmenaJump;
            } else if (Math.abs(player.vx) > 0.5) {
                currentImg = imgOmenaRun;
            }

            if (currentImg.complete) {
                // Adjust drawing offset and size (player rect is 38x48)
                ctx.drawImage(currentImg, -28, -32, 56, 56);
            }
            ctx.restore();
        }

        function update() {
            if (gameState !== 'PLAYING') return;

            if (keys.left) {
                player.vx = -player.speed;
                player.facingLeft = true;
            } else if (keys.right) {
                player.vx = player.speed;
                player.facingLeft = false;
            } else {
                player.vx *= 0.8;
            }

            player.vy += player.gravity;

            player.x += player.vx;
            player.y += player.vy;

            player.squash += (1.0 - player.squash) * 0.12;

            player.grounded = false;
            platforms.forEach(plat => {
                if (
                    player.x < plat.x + plat.w &&
                    player.x + player.width > plat.x &&
                    player.y + player.height >= plat.y &&
                    player.y + player.height <= plat.y + plat.h + player.vy
                ) {
                    if (player.vy > 0) {
                        player.y = plat.y - player.height;
                        player.vy = 0;
                        if (!player.grounded) {
                            player.squash = 0.82; 
                        }
                        player.grounded = true;
                    }
                }
            });

            activeItems.forEach(item => {
                if (!item.collected &&
                    player.x < item.x + item.w &&
                    player.x + player.width > item.x &&
                    player.y < item.y + item.h &&
                    player.y + player.height > item.y
                ) {
                    item.collected = true;
                    playSound('collect');
                    score += 100;
                    collectedCount++;
                    collectedList.push(item);

                    createBurstParticles(item.x + 18, item.y + 18, '#facc15');
                    showSpotToast(item);

                    updateHUD();
                }
            });

            if (player.y > CANVAS_HEIGHT + 80) {
                player.x = Math.max(80, player.x - 240);
                player.y = 200;
                player.vy = 0;
            }

            const targetCamX = player.x - CANVAS_WIDTH / 3;
            cameraX += (targetCamX - cameraX) * 0.1;
            if (cameraX < 0) cameraX = 0;

            updateParticles();

            if (player.x >= goal.x) {
                gameState = 'CLEAR';
                playSound('clear');
                createBurstParticles(goal.x + 35, goal.y + 30, '#38bdf8');

                // Data Integration: Save points to localStorage for main app
                const currentPoints = parseInt(localStorage.getItem('eco_points') || '0', 10);
                localStorage.setItem('eco_points', (currentPoints + score).toString());

                document.getElementById('end-title').innerText = `🏆 ${activeRoute.num} 완주 성공!`;
                document.getElementById('end-desc').innerHTML = `
                    오매나와 함께 <b>[${activeRoute.num} - ${activeRoute.theme}]</b> 노선을 타고,<br>
                    공공데이터 연계 주요 유명 관광지를 성공적으로 수집했습니다!<br><br>
                    🌱 <b>획득 에코포인트:</b> <span class="text-amber-300 font-extrabold text-lg">+${score} PT</span><br>
                    <span class="text-emerald-300 text-xs mt-1 block">(총 누적: ${currentPoints + score} PT)</span>
                `;

                const spotContainer = document.getElementById('collected-spots-list');
                document.getElementById('end-collection-count').innerText = `${collectedList.length} / ${activeItems.length} 수집 완료`;
                spotContainer.innerHTML = '';

                if (collectedList.length === 0) {
                    spotContainer.innerHTML = '<span class="text-slate-500 text-xs col-span-3">수집한 관광지가 없습니다.</span>';
                } else {
                    collectedList.forEach(spot => {
                        const tag = document.createElement('div');
                        tag.className = 'bg-slate-800/90 border border-slate-700/80 rounded-xl p-2 flex flex-col justify-center text-left';
                        tag.innerHTML = `
                            <span class="text-[11px] font-bold text-amber-300 line-clamp-1">📍 ${spot.name}</span>
                            <span class="text-[9px] text-slate-400 mt-0.5">반경 ${spot.distance}</span>
                        `;
                        spotContainer.appendChild(tag);
                    });
                }

                document.getElementById('end-screen').classList.remove('hidden');
            }
        }

        function render() {
            ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            const bgGradient = ctx.createLinearGradient(0, 0, 0, CANVAS_HEIGHT);
            if (activeRoute.category === 'CULTURE') {
                bgGradient.addColorStop(0, '#0f172a');
                bgGradient.addColorStop(1, '#1e3a8a');
            } else if (activeRoute.category === 'NATURE') {
                bgGradient.addColorStop(0, '#064e3b');
                bgGradient.addColorStop(1, '#022c22');
            } else if (activeRoute.category === 'HISTORY') {
                bgGradient.addColorStop(0, '#312e81');
                bgGradient.addColorStop(1, '#1e1b4b');
            } else {
                bgGradient.addColorStop(0, '#111827');
                bgGradient.addColorStop(1, '#1f2937');
            }
            ctx.fillStyle = bgGradient;
            ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            ctx.save();
            ctx.translate(-cameraX, 0);

            ctx.fillStyle = 'rgba(255, 255, 255, 0.06)';
            ctx.beginPath();
            ctx.moveTo(100, 470);
            ctx.lineTo(450, 180);
            ctx.lineTo(800, 470);
            ctx.fill();

            ctx.fillStyle = 'rgba(255, 255, 255, 0.04)';
            ctx.beginPath();
            ctx.moveTo(1000, 470);
            ctx.lineTo(1380, 150);
            ctx.lineTo(1750, 470);
            ctx.fill();

            platforms.forEach(plat => {
                if (plat.type === 'ground') {
                    ctx.fillStyle = '#10b981';
                    ctx.fillRect(plat.x, plat.y, plat.w, 14);
                    ctx.fillStyle = '#1e293b';
                    ctx.fillRect(plat.x, plat.y + 14, plat.w, plat.h - 14);
                } else if (plat.type === 'bus') {
                    ctx.fillStyle = '#2563eb';
                    ctx.beginPath();
                    ctx.roundRect(plat.x, plat.y, plat.w, plat.h, 8);
                    ctx.fill();
                    ctx.fillStyle = '#ffffff';
                    ctx.font = 'bold 11px sans-serif';
                    ctx.fillText(plat.label, plat.x + 10, plat.y + 15);
                } else if (plat.type === 'subway') {
                    ctx.fillStyle = '#6366f1';
                    ctx.beginPath();
                    ctx.roundRect(plat.x, plat.y, plat.w, plat.h, 8);
                    ctx.fill();
                    ctx.fillStyle = '#ffffff';
                    ctx.font = 'bold 11px sans-serif';
                    ctx.fillText(plat.label, plat.x + 10, plat.y + 15);
                } else {
                    ctx.fillStyle = '#e2e8f0';
                    ctx.beginPath();
                    ctx.roundRect(plat.x, plat.y, plat.w, plat.h, 8);
                    ctx.fill();
                    ctx.fillStyle = '#0f172a';
                    ctx.font = 'bold 11px sans-serif';
                    ctx.fillText(plat.label, plat.x + 10, plat.y + 15);
                }
            });

            activeItems.forEach(item => {
                if (!item.collected) {
                    const bobbingY = item.y + Math.sin(Date.now() * 0.006 + item.x) * 5;

                    ctx.fillStyle = 'rgba(0,0,0,0.3)';
                    ctx.beginPath();
                    ctx.ellipse(item.x + 18, item.y + 36, 12, 4, 0, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = '#f59e0b';
                    ctx.beginPath();
                    ctx.arc(item.x + 18, bobbingY + 12, 15, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 2.5;
                    ctx.stroke();

                    ctx.fillStyle = '#ffffff';
                    ctx.font = '13px sans-serif';
                    ctx.fillText('🏛️', item.x + 10, bobbingY + 17);

                    ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
                    ctx.beginPath();
                    ctx.roundRect(item.x - 42, bobbingY - 24, 120, 24, 8);
                    ctx.fill();
                    ctx.strokeStyle = '#facc15';
                    ctx.lineWidth = 1;
                    ctx.stroke();

                    ctx.fillStyle = '#f8fafc';
                    ctx.font = 'bold 10px sans-serif';
                    ctx.fillText(item.name, item.x - 36, bobbingY - 8);
                }
            });

            drawParticles();

            ctx.fillStyle = '#3b82f6';
            ctx.roundRect(goal.x, goal.y, goal.w, goal.h, 12);
            ctx.fill();
            ctx.strokeStyle = '#60a5fa';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 14px sans-serif';
            ctx.fillText('ARRIVE', goal.x + 9, goal.y + 32);
            ctx.font = 'bold 11px sans-serif';
            ctx.fillText('종점 승강장', goal.x + 6, goal.y + 58);

            drawOmena(player.x, player.y, player.facingLeft, player.squash);

            ctx.restore();
        }

        function gameLoop() {
            update();
            render();
            requestAnimationFrame(gameLoop);
        }

        initControls();
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
